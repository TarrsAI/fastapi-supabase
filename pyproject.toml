[project]
name = "fastapi-supabase"
version = "0.2.0"
description = "Tarrs-ready FastAPI + Supabase backend starter (supabase-py + RLS-first)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "supabase>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008 = "no function calls in default args". FastAPI's Depends() /
# Path() / Query() ARE the canonical way to declare dependencies +
# validation, so this rule fires on every router function. Off.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["build/", "dist/", ".venv/"]
